[project]
name = "app"
version = "0.1.0"
description = "FinAlly backend: FastAPI app, market data, portfolio, LLM chat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "litellm>=1.104.0",
    "massive>=2.8.0",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
