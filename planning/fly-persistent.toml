# App name and region are supplied by scripts/deploy_fly_windows.ps1.
[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8003"
  APP_MODULE = "app.main:app"
  AUTH_DISABLED = "false"
  AUTH_COOKIE_SECURE = "true"
  FINALLY_DB_PATH = "/app/db/finally.db"
  MASSIVE_POLL_INTERVAL_SECONDS = "0.5"

[http_service]
  internal_port = 8003
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[mounts]]
  source = "finally_data"
  destination = "/app/db"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
